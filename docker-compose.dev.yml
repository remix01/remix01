##############################################################################
# LiftGO – Local Development Override
#
# Extends docker-compose.yml with developer-friendly settings:
#   - MinIO API (9000) and Console (9001) are exposed to the host
#   - Next.js runs in dev mode with hot-reload
#   - Redis exposed on localhost:6380
#   - No SSL / Nginx (use Next.js dev server directly)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Or add an alias to your shell:
#   alias liftgo-dev='docker compose -f docker-compose.yml -f docker-compose.dev.yml'
##############################################################################

version: '3.8'

services:
  app:
    # In dev, run with `npm run dev` instead of the production build
    build:
      context: .
      dockerfile: Dockerfile.dev     # Lightweight dev Dockerfile (see below)
      args:
        - NODE_ENV=development
    environment:
      - NODE_ENV=development
      - STORAGE_PROVIDER=minio
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_REGION=us-east-1
    ports:
      - "3000:3000"
    volumes:
      # Mount source so hot-reload works
      - .:/app
      - /app/node_modules
      - /app/.next

  # Expose MinIO ports in development
  minio:
    ports:
      - "9000:9000"   # S3 API – used by Next.js app and SDK clients
      - "9001:9001"   # MinIO Console – open http://localhost:9001

  # Expose Redis in development (different host port to avoid conflicts)
  redis:
    ports:
      - "6380:6379"

  # Disable Nginx in dev – access app directly on port 3000
  nginx:
    profiles:
      - production-only

  # Grafana Alloy — collects Docker logs, host metrics, scrapes /api/metrics,
  # and forwards everything to Grafana Cloud (remix01.grafana.net).
  # Only runs when GRAFANA_INSTANCE_ID and GRAFANA_API_TOKEN are set.
  grafana-alloy:
    image: grafana/alloy:latest
    profiles:
      - observability
    volumes:
      - ./grafana-alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "12345:12345" # Alloy UI (http://localhost:12345)
    environment:
      - GRAFANA_INSTANCE_ID=${GRAFANA_INSTANCE_ID}
      - GRAFANA_API_TOKEN=${GRAFANA_API_TOKEN}
      - GRAFANA_OTLP_ENDPOINT=${GRAFANA_OTLP_ENDPOINT}
      - GRAFANA_LOKI_URL=${GRAFANA_LOKI_URL}
      - GRAFANA_PROMETHEUS_URL=${GRAFANA_PROMETHEUS_URL}
      - METRICS_SCRAPE_TOKEN=${METRICS_SCRAPE_TOKEN}
    command:
      - run
      - /etc/alloy/config.alloy
    depends_on:
      - app
    restart: unless-stopped

volumes:
  minio-data:
    driver: local
